<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>身体診察ガチャ</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/>
              <path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/>
              <circle cx="20" cy="10" r="2"/>
            </svg>
          </span>
          <h1 class="brand-title">身体診察ガチャ</h1>
        </div>
        <div id="remaining-badge" class="remaining-badge" aria-live="polite">
          読み込み中...
        </div>
      </div>
    </header>

    <main class="app-main">
      <!-- 操作パネル -->
      <section class="control-panel" aria-label="出題条件と抽選">
        <div class="filter-section">
          <div class="section-label-row">
            <span class="section-label">領域（大分類）</span>
            <span class="section-hint">複数選択可</span>
          </div>
          <div id="category-chips" class="chip-list" role="group" aria-label="大分類フィルター">
            <!-- JSで動的生成 -->
          </div>
        </div>

        <div class="options-row">
          <label class="toggle-control" for="exclude-toggle">
            <input type="checkbox" id="exclude-toggle" class="toggle-input">
            <span class="toggle-track" aria-hidden="true">
              <span class="toggle-thumb"></span>
            </span>
            <span class="toggle-label">一度出た項目を除外する</span>
          </label>

          <button type="button" id="reset-btn" class="reset-btn" disabled>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
            <span>リセット</span>
            <span id="drawn-count" class="drawn-count" hidden>0</span>
          </button>
        </div>

        <div class="draw-actions">
          <button type="button" id="draw-one-btn" class="draw-btn draw-btn--single" disabled>
            <span class="draw-btn-main">1個引く</span>
            <span class="draw-btn-sub">単発練習</span>
          </button>
          <button type="button" id="draw-five-btn" class="draw-btn draw-btn--multi" disabled>
            <span class="draw-btn-main">5個まとめて引く</span>
            <span class="draw-btn-sub">小分類かぶり回避</span>
          </button>
        </div>
      </section>

      <!-- 通知バナー（全件出切り・エラー時） -->
      <div id="notice-banner" class="notice-banner" role="alert" hidden>
        <div class="notice-content">
          <span class="notice-icon" aria-hidden="true">!</span>
          <p id="notice-text" class="notice-text"></p>
        </div>
        <button type="button" id="notice-reset-btn" class="notice-action-btn" hidden>
          出題済みをリセット
        </button>
      </div>

      <!-- 結果表示エリア -->
      <section id="result-area" class="result-area" aria-label="抽選結果" aria-live="polite">
        <div id="empty-state" class="empty-state">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="16" rx="3"/>
              <path d="M8 10h8"/>
              <path d="M8 14h5"/>
            </svg>
          </div>
          <p class="empty-title">ボタンを押して出題スタート</p>
          <p class="empty-desc">練習後に「答え合わせ」でチェックリストを確認できます</p>
        </div>

        <div id="shuffle-stage" class="shuffle-stage" hidden>
          <div class="shuffle-card">
            <div class="shuffle-header">
              <span class="shuffle-spinner" aria-hidden="true"></span>
              <span id="shuffle-status" class="shuffle-status">抽選中...</span>
            </div>
            <div class="shuffle-preview">
              <span id="shuffle-badge" class="category-badge">---</span>
              <p id="shuffle-minor" class="shuffle-minor"></p>
              <p id="shuffle-title" class="shuffle-title">...</p>
            </div>
            <div class="shuffle-progress-track" aria-hidden="true">
              <div id="shuffle-progress-bar" class="shuffle-progress-bar"></div>
            </div>
          </div>
        </div>

        <div id="results-wrapper" class="results-wrapper" hidden>
          <div class="results-header">
            <h2 id="results-heading" class="results-heading">抽選結果</h2>
            <span id="results-meta" class="results-meta"></span>
          </div>
          <div id="result-list" class="result-list">
            <!-- JSでカード生成 -->
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="./script.js"></script>
</body>
</html>

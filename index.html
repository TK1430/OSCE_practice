<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>身体診察ガチャ</title>
  <link rel="stylesheet" href="./style.css?v=5">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-inner">
        <h1 class="brand-title">身体診察ガチャ</h1>
        <div id="remaining-badge" class="remaining-status" aria-live="polite">
          読み込み中
        </div>
      </div>
    </header>

    <main class="app-main">
      <!-- 操作エリア -->
      <section class="control-section" aria-label="出題条件と抽選">
        <div class="filter-block">
          <div class="section-label-row">
            <span class="section-label">領域</span>
            <span class="section-hint">複数選択可</span>
          </div>
          <div id="category-chips" class="category-list" role="group" aria-label="大分類フィルター">
            <!-- JSで動的生成 -->
          </div>
        </div>

        <div class="options-row">
          <label class="toggle-control" for="exclude-toggle">
            <input type="checkbox" id="exclude-toggle" class="toggle-input">
            <span class="toggle-track" aria-hidden="true">
              <span class="toggle-thumb"></span>
            </span>
            <span class="toggle-label">一度出た項目を除外する</span>
          </label>

          <button type="button" id="reset-btn" class="reset-btn" disabled>
            <span id="reset-btn-label">出題済みをリセット</span>
          </button>
        </div>

        <div class="draw-actions">
          <button type="button" id="draw-one-btn" class="draw-btn draw-btn--single" disabled>
            1個引く
          </button>
          <div class="draw-multi-group">
            <select id="draw-count-select" class="draw-count-select" aria-label="まとめて引く個数" disabled>
              <option value="5" selected>5</option>
              <option value="8">8</option>
              <option value="10">10</option>
            </select>
            <button type="button" id="draw-multi-btn" class="draw-btn draw-btn--multi" disabled>
              個まとめて引く
            </button>
          </div>
        </div>
      </section>

      <hr class="section-divider" aria-hidden="true">

      <!-- 通知（全件出切り・エラー時） -->
      <div id="notice-banner" class="notice-strip" role="alert" hidden>
        <p id="notice-text" class="notice-text"></p>
        <button type="button" id="notice-reset-btn" class="notice-action-btn" hidden>
          出題済みをリセット
        </button>
      </div>

      <!-- 結果表示エリア -->
      <section id="result-area" class="result-area" aria-label="抽選結果" aria-live="polite">
        <div id="empty-state" class="empty-state">
          <p class="empty-text">領域を選び、抽選ボタンを押してください。</p>
        </div>

        <div id="shuffle-stage" class="shuffle-stage" hidden>
          <p id="shuffle-status" class="shuffle-status">抽選中...</p>
          <div class="shuffle-progress-track" aria-hidden="true">
            <div id="shuffle-progress-bar" class="shuffle-progress-bar"></div>
          </div>
          <div class="shuffle-preview">
            <span id="shuffle-badge" class="category-tag">---</span>
            <p id="shuffle-minor" class="shuffle-minor"></p>
            <p id="shuffle-title" class="shuffle-title"></p>
          </div>
        </div>

        <div id="results-wrapper" class="results-wrapper" hidden>
          <div class="results-header">
            <h2 id="results-heading" class="results-heading">抽選結果</h2>
          </div>
          <div id="result-list" class="result-list">
            <!-- JSで生成 -->
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="./script.js?v=5"></script>
</body>
</html>
